name: Publish docker image
# Triggered on Dockerfile changes pushed to main, and weekly to stay fresh.
on:
  push:
    branches:
      - main
    paths:
      - docker/max78000/Dockerfile
      - .github/workflows/max78000-docker-push.yml
  schedule:
    # Every Monday at 4:15am
    - cron: '15 4 * * 1'
  workflow_dispatch:

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/max78000/Dockerfile
          tags: ghcr.io/vamshi-smartrotamac/max78000-toolchain:v2024_10
          push: true
