name: Publish firmware docker image (reusable)

# Reusable image publisher. Callers provide the Dockerfile path and image name/tag.
# Publishes to ghcr.io/<repo-owner>/<image-name>:<image-tag>.
on:
  workflow_call:
    inputs:
      dockerfile-path:
        type: string
        required: true
      image-name:
        type: string
        required: true
      image-tag:
        type: string
        required: true

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          push: true
          # Reuse unchanged layers (e.g. the heavy MSDK clone) across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
